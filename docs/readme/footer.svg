<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Next stop: a city that moves together">
<title>Next stop: a city that moves together</title>
<defs>
  <pattern id="honey" width="34.64" height="60" patternUnits="userSpaceOnUse">
    <path d="M17.32 0L34.64 10V30L17.32 40L0 30V10Z M17.32 40V60" fill="none" stroke="#F9AB00" stroke-width="1" stroke-opacity="0.07"/>
  </pattern>
  <pattern id="honeyBright" width="34.64" height="60" patternUnits="userSpaceOnUse">
    <path d="M17.32 0L34.64 10V30L17.32 40L0 30V10Z M17.32 40V60" fill="none" stroke="#FFD166" stroke-width="1.2" stroke-opacity="0.55"/>
  </pattern>
  <radialGradient id="spot"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1200" height="150" rx="18" fill="#0D1117"/>
<rect width="1200" height="150" rx="18" fill="url(#honey)"/>
<mask id="sweep"><rect width="1200" height="150" fill="#000"/>
  <circle cy="68" r="160" fill="url(#spot)">
    <animate attributeName="cx" values="-300;1500" dur="9s" repeatCount="indefinite"/>
  </circle>
</mask>
<rect width="1200" height="150" rx="18" fill="url(#honeyBright)" mask="url(#sweep)"/>
<rect x="0.5" y="0.5" width="1199" height="149" rx="18" fill="none" stroke="#30363D"/>
<defs><path id="fr" d="M -40 112 C 300 92, 900 132, 1240 108"/></defs>
