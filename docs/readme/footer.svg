<g filter="url(#glow)"><circle r="3.4" fill="#FFD166"/><circle r="7.48" fill="#FFD166" opacity="0.18"/><animateMotion dur="9.00s" begin="0.00s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#fr"/></animateMotion></g>
